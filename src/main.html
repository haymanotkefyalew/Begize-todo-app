<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Begize |main page</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="main.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="modals">
      <div class="projects-modal-none">
        <button class="cancel-pmodal">X</button>
        <h3>Add new Project</h3>
        <form action="/" class="projects-form">
          <div class="project-name">
            <label for="project-name">Project Name</label><br />
            <input type="text" id="project-name" />
          </div>
          <div class="Project-description">
            <label for="project-description">Description</label><br /><br />
            <textarea
              name="projectDescription"
              id="project-description"
              cols="45"
              rows="8"
            ></textarea>
          </div>
        </form>
        <div class="projects-modal-btns">
          <button class="save-project">Save</button>
        </div>
      </div>
      <div class="tasks-modal-none">
        <button class="cancel-tmodal">X</button>
        <h3>Add new Task</h3>
        <form action="/" class="tasks-form">
          <div class="task-title">
            <label for="task-title">Title</label><br />
            <input type="text" id="task-title" />
          </div>
          <div class="task-description">
            <label for="task-description">Description</label><br />
            <textarea
              name="taskDescription"
              id="task-description"
              cols="45"
              rows="5"
            ></textarea>
          </div>
          <div class="task-repetition">
            <select name="repetition" id="task-repetition">
              <option selected value="onetime" class="options option1">
                Specific Date
              </option>
              <option value="daily" class="options option2">Daily</option>
              <option value="weekly" class="options">Weekly</option>
              <option value="monthly" class="options">Monthly</option>
            </select>
          </div>
          <div class="task-date">
            <label for="task-date">Due Date</label><br />
            <input type="date" id="task-date" />
          </div>
        </form>
        <button class="save-task">Save</button>
      </div>
    </div>
    <div class="main-container">
      <header class="m-header">
        <div class="search">
          <label for="search">Icon</label>
          <input type="search" name="search" id="search" />
        </div>
        <div class="profile">
          <div class="profile-photo">
            <img src="https://placehold.co/50x50/000000/FFFFFF/png" alt="" />
            <p class="usernamec">john</p>
          </div>
        </div>
      </header>
      <section class="sidebar">
        <div class="m-logo">
          <a href="index.html"
            ><img src="https://placehold.co/100x60/000000/FFFFFF/png" alt=""
          /></a>
        </div>
        <div class="sidebar-cont">
          <div class="activities-cont">
            <h3 class="activities-heading">Activities</h3>
            <div class="activities">
              <h4>All Tasks</h4>
              <h4>pending</h4>
              <h4>completed</h4>
            </div>
          </div>
          <div class="categories-cont">
            <h3 class="categories-heading">Categories</h3>
            <div class="categories">
              <details>
                <summary class="project-title">Class work</summary>
                <div class="tasks">
                  <h4 class="task">home Work</h4>
                  <button class="addNewTask">add task +</button>
                </div>
              </details>
              <button class="addNewCategory">add new category +</button>
            </div>
          </div>
        </div>
      </section>
      <section class="center-content"></section>
      <!-- <section class="right-sidebar"></section> -->
      <footer class="footer">
        <p class="footer-text">&copy; 2026 Begize. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
